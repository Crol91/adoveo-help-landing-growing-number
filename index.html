<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Juristens klocka tickar – med HELP Juristförsäkring betalar du ingen timkostnad." />
    <meta name="theme-color" content="#FFFFFF" />
    <title>HELP Juristförsäkring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="preload" as="image" href="images/hero-bg.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__inner">
          <a class="logo" href="https://help.se/">
            <img src="images/_help-logo_2024_rgb_original.svg" class="logo-img" alt="HELP Logo" />
          </a>

          <a class="login" href="https://minsida.helpforsakring.se/logga-in-privat">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
            </svg>
            <span>Logga in</span>
          </a>
        </div>
      </header>

      <main class="hero">
        <section class="meter" id="meter" aria-labelledby="meter-title">
          <h1 id="meter-title" class="visually-hidden">HELP Juristförsäkring – utan timkostnad</h1>

          <!-- Rad 1: klockikon + kort status (byts vid stopp) -->
          <div class="meter__status">
            <span class="clock" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle class="clock__face" cx="12" cy="12" r="9" />
                <path class="clock__hand" d="M12 12V6.5" />
                <path class="clock__check" d="m7.5 12.5 3 3 6-6.5" />
              </svg>
            </span>
            <span class="swap">
              <span class="swap__item meter__label">Juristens klocka tickar …</span>
              <span class="swap__item meter__label meter__label--done" aria-hidden="true">Med HELP – utan timkostnad.</span>
            </span>
          </div>

          <!-- Rad 2: siffran -->
          <p class="meter__amount" aria-live="off">
            <span class="meter__value" id="meter-value">0</span>
            <span class="meter__unit">kr</span>
          </p>

          <!-- Rad 3: diskret fotnot -->
          <p class="meter__note" id="meter-note">ca 2 500 kr/h · snabbspolat</p>

          <!-- Rad 4: knapp → CTA (samma plats, inget hopp) -->
          <div class="swap meter__actions">
            <button class="swap__item stop" type="button" id="stop">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" /></svg>
              <span>Stoppa klockan</span>
            </button>

            <a class="swap__item cta" href="https://help.se/" id="cta" tabindex="-1" aria-hidden="true">
              <span>Skaffa HELP</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </a>
          </div>

          <!-- För skärmläsare: meddela resultatet -->
          <p class="visually-hidden" id="announce" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <script src="index.js"></script>
  </body>
</html>
